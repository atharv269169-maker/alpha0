<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Alpha1 — Study Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#020408;--bg2:#060d14;--neon:#00f0ff;--neon2:#7b2fff;--neon3:#ff2f7b;--neon4:#00ff88;--text:#e8f4ff;--muted:#5a7a8a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow-x:hidden;min-height:100vh;}

  #bg-3d{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .grid-lines{position:fixed;inset:0;background-image:linear-gradient(rgba(0,240,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 6%;background:rgba(2,4,8,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,240,255,0.1);}
  .nav-logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.1rem;color:var(--neon);text-shadow:0 0 20px var(--neon);letter-spacing:3px;text-decoration:none;}
  .nav-back{font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--muted);text-decoration:none;letter-spacing:2px;text-transform:uppercase;transition:color .2s;}
  .nav-back:hover{color:var(--neon);}

  .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6rem 2rem 4rem;}

  /* MODE TABS */
  .mode-tabs{display:flex;gap:0;margin-bottom:3rem;border:1px solid rgba(0,240,255,0.15);overflow:hidden;}
  .mode-tab{padding:10px 24px;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .3s;}
  .mode-tab.active{background:rgba(0,240,255,0.1);color:var(--neon);box-shadow:inset 0 0 20px rgba(0,240,255,0.05);}
  .mode-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.03);}

  /* TIMER CIRCLE */
  .timer-wrap{position:relative;width:300px;height:300px;margin:0 auto 3rem;}
  .timer-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .timer-track{fill:none;stroke:rgba(0,240,255,0.08);stroke-width:6;}
  .timer-progress{fill:none;stroke:var(--neon);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s ease, stroke .5s;}
  .timer-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .timer-display{font-family:'Orbitron',monospace;font-size:4rem;font-weight:900;color:var(--text);text-shadow:0 0 30px rgba(0,240,255,0.3);letter-spacing:4px;line-height:1;}
  .timer-label{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:8px;}
  .timer-session{font-family:'Orbitron',monospace;font-size:0.7rem;color:var(--neon2);letter-spacing:2px;margin-top:4px;}

  /* GLOW RING */
  .timer-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,0.05),transparent 70%);pointer-events:none;transition:background .5s;}
  .timer-wrap.break .timer-glow{background:radial-gradient(circle,rgba(0,255,136,0.07),transparent 70%);}
  .timer-wrap.break .timer-progress{stroke:var(--neon4);}
  .timer-wrap.break .timer-display{text-shadow:0 0 30px rgba(0,255,136,0.3);}

  /* CONTROLS */
  .controls{display:flex;gap:16px;align-items:center;margin-bottom:3rem;flex-wrap:wrap;justify-content:center;}
  .btn-main{background:linear-gradient(135deg,var(--neon2),var(--neon));color:var(--bg);border:none;padding:16px 48px;font-family:'Orbitron',monospace;font-weight:700;font-size:0.82rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;box-shadow:0 0 30px rgba(0,240,255,0.2);}
  .btn-main:hover{box-shadow:0 0 50px rgba(0,240,255,0.5);transform:translateY(-2px);}
  .btn-main.running{background:linear-gradient(135deg,var(--neon3),var(--neon2));}
  .btn-secondary{background:transparent;border:1px solid rgba(0,240,255,0.2);color:var(--muted);padding:16px 24px;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:2px;cursor:pointer;transition:all .3s;}
  .btn-secondary:hover{border-color:var(--neon);color:var(--neon);}

  /* STATS */
  .stats-row{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;margin-bottom:3rem;}
  .stat-box{background:rgba(6,13,20,0.9);border:1px solid rgba(0,240,255,0.1);padding:20px 28px;text-align:center;min-width:110px;transition:border-color .3s,transform .3s;}
  .stat-box:hover{border-color:rgba(0,240,255,0.3);transform:translateY(-4px);}
  .stat-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--neon);text-shadow:0 0 15px var(--neon);}
  .stat-lbl{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}

  /* CUSTOM SETTINGS */
  .settings-card{background:rgba(6,13,20,0.9);border:1px solid rgba(0,240,255,0.1);padding:28px;max-width:500px;width:100%;margin-bottom:2rem;}
  .settings-title{font-family:'Orbitron',monospace;font-size:0.75rem;color:var(--neon);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;}
  .settings-row{display:flex;gap:16px;flex-wrap:wrap;}
  .setting-item{flex:1;min-width:120px;}
  .setting-label{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:block;}
  .setting-input{width:100%;background:rgba(0,240,255,0.04);border:1px solid rgba(0,240,255,0.15);color:var(--text);padding:10px 14px;font-family:'Orbitron',monospace;font-size:0.9rem;text-align:center;outline:none;transition:border-color .2s;}
  .setting-input:focus{border-color:var(--neon);}
  .apply-btn{width:100%;margin-top:16px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.2);color:var(--neon);padding:10px;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:2px;cursor:pointer;transition:all .2s;}
  .apply-btn:hover{background:rgba(0,240,255,0.15);}

  /* SESSIONS DOTS */
  .sessions-dots{display:flex;gap:8px;justify-content:center;margin-bottom:2rem;}
  .s-dot{width:12px;height:12px;border-radius:50%;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.2);transition:all .3s;}
  .s-dot.done{background:var(--neon);box-shadow:0 0 10px var(--neon);}
  .s-dot.current{background:var(--neon2);box-shadow:0 0 10px var(--neon2);animation:pulse 1s infinite;}

  /* TOAST */
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);color:var(--neon);padding:12px 28px;font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:2px;opacity:0;transition:all .4s;z-index:200;backdrop-filter:blur(10px);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.break-toast{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.3);color:var(--neon4);}

  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}
</style>
</head>
<body>
<canvas id="bg-3d"></canvas>
<div class="grid-lines"></div>
<div class="toast" id="toast"></div>

<nav>
  <a href="https://atharv269169-maker.github.io/alpha0/" class="nav-logo">ALPHA1</a>
  <a href="https://atharv269169-maker.github.io/alpha0/" class="nav-back">← Back to Site</a>
</nav>

<div class="page">

  <!-- MODE TABS -->
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('focus')">🎯 Focus</button>
    <button class="mode-tab" onclick="setMode('short')">☕ Short Break</button>
    <button class="mode-tab" onclick="setMode('long')">🌙 Long Break</button>
  </div>

  <!-- SESSION DOTS -->
  <div class="sessions-dots" id="sessionDots"></div>

  <!-- TIMER -->
  <div class="timer-wrap" id="timerWrap">
    <div class="timer-glow"></div>
    <svg class="timer-svg" viewBox="0 0 300 300">
      <circle class="timer-track" cx="150" cy="150" r="130"/>
      <circle class="timer-progress" id="timerProgress" cx="150" cy="150" r="130"/>
    </svg>
    <div class="timer-inner">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-label" id="timerLabel">FOCUS TIME</div>
      <div class="timer-session" id="timerSession">SESSION 1 OF 4</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn-secondary" onclick="resetTimer()">↺ RESET</button>
    <button class="btn-main" id="startBtn" onclick="toggleTimer()">▶ START</button>
    <button class="btn-secondary" onclick="skipTimer()">⏭ SKIP</button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-val" id="statSessions">0</div>
      <div class="stat-lbl">Sessions</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statFocus">0</div>
      <div class="stat-lbl">Min Focused</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statBreaks">0</div>
      <div class="stat-lbl">Breaks</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-lbl">Day Streak</div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-card">
    <div class="settings-title">⚙ Custom Timings</div>
    <div class="settings-row">
      <div class="setting-item">
        <span class="setting-label">Focus (min)</span>
        <input class="setting-input" type="number" id="setFocus" value="25" min="1" max="90"/>
      </div>
      <div class="setting-item">
        <span class="setting-label">Short Break</span>
        <input class="setting-input" type="number" id="setShort" value="5" min="1" max="30"/>
      </div>
      <div class="setting-item">
        <span class="setting-label">Long Break</span>
        <input class="setting-input" type="number" id="setLong" value="15" min="1" max="60"/>
      </div>
      <div class="setting-item">
        <span class="setting-label">Sessions</span>
        <input class="setting-input" type="number" id="setSessions" value="4" min="2" max="8"/>
      </div>
    </div>
    <button class="apply-btn" onclick="applySettings()">APPLY SETTINGS</button>
  </div>

</div>

<script>
// === 3D BG ===
const canvas = document.getElementById('bg-3d');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);
const cubes = Array.from({length:4},(_,i)=>({
  x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
  size:Math.random()*50+25, rotX:Math.random()*Math.PI*2, rotY:Math.random()*Math.PI*2, rotZ:Math.random()*Math.PI*2,
  vX:(Math.random()-.5)*.004, vY:(Math.random()-.5)*.004, vZ:(Math.random()-.5)*.004,
  color:['rgba(0,240,255,','rgba(123,47,255,','rgba(0,255,136,','rgba(255,47,123,'][i%4], opacity:.06
}));
const pts2 = Array.from({length:60},()=>({
  x:Math.random()*3000,y:Math.random()*3000,r:Math.random()*1.2+.3,
  vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
  color:['rgba(0,240,255,','rgba(123,47,255,'][Math.floor(Math.random()*2)],a:Math.random()*.2+.05
}));
function project(x,y,z,cx,cy){const f=400,s=f/(f+z);return{x:cx+x*s,y:cy+y*s};}
function drawCube(c){
  const s=c.size,pts3=[[-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],[-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]];
  const pts=pts3.map(([x,y,z])=>{
    let ny=y*Math.cos(c.rotX)-z*Math.sin(c.rotX),nz=y*Math.sin(c.rotX)+z*Math.cos(c.rotX);y=ny;z=nz;
    let nx=x*Math.cos(c.rotY)+z*Math.sin(c.rotY);nz=-x*Math.sin(c.rotY)+z*Math.cos(c.rotY);x=nx;z=nz;
    nx=x*Math.cos(c.rotZ)-y*Math.sin(c.rotZ);ny=x*Math.sin(c.rotZ)+y*Math.cos(c.rotZ);
    return project(nx,ny,z,c.x,c.y);
  });
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>{
    ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=c.color+c.opacity+')';ctx.lineWidth=.8;ctx.stroke();
  });
  c.rotX+=c.vX;c.rotY+=c.vY;c.rotZ+=c.vZ;
}
function bgAnimate(){
  ctx.clearRect(0,0,W,H);
  cubes.forEach(c=>drawCube(c));
  pts2.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color+p.a+')';ctx.fill();
  });
  requestAnimationFrame(bgAnimate);
}
bgAnimate();

// === TIMER ===
let FOCUS=25, SHORT=5, LONG=15, TOTAL_SESSIONS=4;
let currentMode='focus', timeLeft=FOCUS*60, totalTime=FOCUS*60;
let running=false, interval=null;
let sessionsDone=0, focusMinutes=0, breaksCount=0;
let streak = parseInt(localStorage.getItem('alpha1_streak')||'0');
let lastDate = localStorage.getItem('alpha1_last_date')||'';

const circumference = 2*Math.PI*130;
document.getElementById('timerProgress').style.strokeDasharray = circumference;

function updateStreak(){
  const today = new Date().toDateString();
  if(lastDate !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if(lastDate === yesterday) streak++;
    else streak = 1;
    localStorage.setItem('alpha1_streak', streak);
    localStorage.setItem('alpha1_last_date', today);
    lastDate = today;
  }
  document.getElementById('statStreak').textContent = streak;
}
updateStreak();

function buildDots(){
  const c = document.getElementById('sessionDots');
  c.innerHTML='';
  for(let i=0;i<TOTAL_SESSIONS;i++){
    const d=document.createElement('div');
    d.className='s-dot'+(i<sessionsDone?' done':i===sessionsDone&&currentMode==='focus'?' current':'');
    c.appendChild(d);
  }
}
buildDots();

function setDisplay(){
  const m=Math.floor(timeLeft/60).toString().padStart(2,'0');
  const s=(timeLeft%60).toString().padStart(2,'0');
  document.getElementById('timerDisplay').textContent=`${m}:${s}`;
  const pct=timeLeft/totalTime;
  document.getElementById('timerProgress').style.strokeDashoffset=circumference*(1-pct)+ '';
  const wrap=document.getElementById('timerWrap');
  wrap.className='timer-wrap'+(currentMode!=='focus'?' break':'');
  document.getElementById('timerLabel').textContent=
    currentMode==='focus'?'FOCUS TIME':currentMode==='short'?'SHORT BREAK':'LONG BREAK';
  document.getElementById('timerSession').textContent=
    `SESSION ${Math.min(sessionsDone+1,TOTAL_SESSIONS)} OF ${TOTAL_SESSIONS}`;
}
setDisplay();

function toggleTimer(){
  if(running){
    clearInterval(interval); running=false;
    document.getElementById('startBtn').textContent='▶ RESUME';
    document.getElementById('startBtn').classList.remove('running');
  } else {
    running=true;
    document.getElementById('startBtn').textContent='⏸ PAUSE';
    document.getElementById('startBtn').classList.add('running');
    interval=setInterval(tick,1000);
  }
}

function tick(){
  if(timeLeft<=0){ timerDone(); return; }
  timeLeft--;
  if(currentMode==='focus') focusMinutes = Math.floor((totalTime-timeLeft)/60);
  setDisplay();
  document.getElementById('statFocus').textContent=focusMinutes;
}

function timerDone(){
  clearInterval(interval); running=false;
  document.getElementById('startBtn').textContent='▶ START';
  document.getElementById('startBtn').classList.remove('running');
  if(currentMode==='focus'){
    sessionsDone++;
    document.getElementById('statSessions').textContent=sessionsDone;
    if(sessionsDone>=TOTAL_SESSIONS){
      showToast('🎉 ALL SESSIONS DONE! TAKE A LONG BREAK!', true);
      setMode('long'); sessionsDone=0;
    } else {
      showToast('✅ FOCUS DONE! TIME FOR A BREAK!', true);
      setMode('short');
    }
    breaksCount++;
    document.getElementById('statBreaks').textContent=breaksCount;
  } else {
    showToast('⚡ BREAK OVER! BACK TO FOCUS!', false);
    setMode('focus');
  }
  buildDots();
  // browser notification
  if(Notification.permission==='granted'){
    new Notification('Alpha1 Timer', {body: currentMode==='focus'?'Focus session done!':'Break over — back to work!'});
  }
}

function setMode(mode){
  clearInterval(interval); running=false;
  document.getElementById('startBtn').textContent='▶ START';
  document.getElementById('startBtn').classList.remove('running');
  currentMode=mode;
  if(mode==='focus') totalTime=timeLeft=FOCUS*60;
  else if(mode==='short') totalTime=timeLeft=SHORT*60;
  else totalTime=timeLeft=LONG*60;
  document.querySelectorAll('.mode-tab').forEach((t,i)=>{
    t.classList.toggle('active',['focus','short','long'][i]===mode);
  });
  setDisplay(); buildDots();
}

function resetTimer(){
  clearInterval(interval); running=false;
  document.getElementById('startBtn').textContent='▶ START';
  document.getElementById('startBtn').classList.remove('running');
  timeLeft=totalTime; setDisplay();
}

function skipTimer(){ timerDone(); }

function applySettings(){
  FOCUS=parseInt(document.getElementById('setFocus').value)||25;
  SHORT=parseInt(document.getElementById('setShort').value)||5;
  LONG=parseInt(document.getElementById('setLong').value)||15;
  TOTAL_SESSIONS=parseInt(document.getElementById('setSessions').value)||4;
  sessionsDone=0; setMode(currentMode); buildDots();
  showToast('✅ SETTINGS APPLIED!', false);
}

function showToast(msg, isBreak){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(isBreak?' break-toast':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// Request notification permission
if(Notification.permission==='default') Notification.requestPermission();
</script>
</body>
</html>
